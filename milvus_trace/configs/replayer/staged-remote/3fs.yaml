# Example 3FS topology. Replace every host and absolute path before use.
controller_repo_root: /absolute/path/to/RAGPerf
controller_trace_root: /absolute/path/to/ragperf-trace-archives
controller_runtime_root: /absolute/path/to/ragperf-offline-runtime
controller_output_root: /absolute/path/to/ragperf-replay-results/3fs
replay_host: replay-node.example.com
replay_user: benchmark
replay_port: 22
transfer_method: rsync
replay_repo_root: /opt/ragperf
replay_venv_root: /opt/ragperf/.venv
replay_runtime_root: /opt/ragperf-runtime
replay_trace_root: /srv/ragperf/traces
replay_output_root: /srv/ragperf/outputs/3fs
replay_meta_root: /srv/ragperf/milvus-meta/3fs
storage_backend: 3fs
replay_diskann_root: /mnt/nvme/milvus-data
expected_fstype: fuse.3fs,fuse3fs,fuse
replay_python: /usr/bin/python3
replay_runtime_requirements: requirements-replay.lock
replay_require_docker: true
replay_container_images: milvus-images.tar
replay_milvus_uri: http://127.0.0.1:19530
